[project]
name = "hermes-allowance"
version = "0.1.0"
description = "Give your AI agent a PayPal wallet with limits. Small purchases auto-pay; big ones wait for your PayPal approval."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn>=0.30", "anthropic>=2.0"]
dev = ["pytest>=8", "fastapi>=0.115", "uvicorn>=0.30", "anthropic>=2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["allowance", "web"]
